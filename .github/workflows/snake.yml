name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#f0f6fc&color_dots=#161b22,#30363d,#6e7681,#b1bac4,#f0f6fc&color_dot_border=#0d1117
            dist/snake-light.svg?color_snake=#24292f&color_dots=#eaeef2,#d0d7de,#8c959f,#57606a,#24292f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
