name: Profile — snake & stats

on:
  schedule:
    - cron: "0 */6 * * *"   # обновление каждые 6 часов
  workflow_dispatch:         # кнопка «Run workflow»
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Цветная змейка: для тёмной и для светлой темы
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#fe428e
            dist/snake-light.svg?palette=github-light&color_snake=#fe428e

      # Цветные карточки статистики (без внешних сервисов)
      - name: Build stats cards
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          OUT_DIR: dist
        run: python3 scripts/profile_cards.py

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

